[[permission]]
identifier = "allow-app-commands"
description = "允许演出播放器全部自定义命令"
commands.allow = [
  "pick_files",
  "pick_save_path",
  "copy_file",
  "make_image_thumb",
  "make_video_thumb",
  "existing_files",
  "write_text_file",
  "read_show_file",
  "store_load",
  "store_save",
  "store_backup",
  "store_dir",
  "vocal_cancel_export",
  "parse_pptx",
  "open_output_window",
  "set_output_fullscreen",
  "close_output_window",
  "set_output_always_on_top",
  "list_monitors",
  "place_output_on_monitor",
  "list_audio_output_devices",
  "audio_play",
  "audio_pause",
  "audio_resume",
  "audio_stop",
  "audio_set_volume",
  "audio_seek",
  "audio_state",
  "audio_set_vocal_cancel",
  "audio_wave",
  "stem_get_instrumental",
  "stem_ensure_instrumental",
  "stem_job_status",
  "spl_list_inputs",
  "spl_start",
  "spl_stop",
  "spl_set_params",
  "spl_get_snapshot"
]
