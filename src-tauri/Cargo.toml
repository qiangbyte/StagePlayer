[package]
name = "stage-player"
version = "0.1.0"
description = "演出播放器：音频 / 视频 / PPT / PDF 一体化演出播放"
authors = ["you"]
edition = "2021"

[lib]
name = "stage_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
roxmltree = "0.20"
base64 = "0.22"
# symphonia-* 覆盖默认 claxon/minimp3，FLAC/MP3 才能真正秒跳（否则只能重开文件逐采样跳）
rodio = { version = "0.20", features = [
  "symphonia-flac",
  "symphonia-mp3",
  "symphonia-wav",
  "symphonia-aac",
  "symphonia-isomp4",
] }
cpal = "0.15"
rustfft = "6"
realfft = "3"
# AI 人声分离（HTDemucs ONNX）→ 本地缓存伴奏
# Windows 上优先启用 DirectML（GPU），显著快于纯 CPU
stem-splitter-core = { version = "1.2", features = ["directml", "onednn", "xnnpack"] }
hound = "3"
sha2 = "0.10"
directories = "5"
# 图片缩略图原生生成（避免 WebView 解码原图导致 OOM）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# 开发态也给推理相关 crate 开优化，否则 AI 分离会极慢
[profile.dev.package.stem-splitter-core]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
# 波形原生解码（wave.rs）开发态也要快
[profile.dev.package.rodio]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3

[profile.release]
# 保持 unwind：音频线程 panic 时可被守护循环捕获重启，演出中不整体闪退
codegen-units = 1
lto = true
opt-level = 3
strip = true
